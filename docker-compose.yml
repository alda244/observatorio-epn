# Entorno local del Observatorio. La misma composición se despliega en AWS
# (docs/infraestructura.md). Las claves se leen de .env; ver .env.example.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: observatorio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_CLAVE_DATOS: ${POSTGRES_CLAVE_DATOS:-rol_datos}
      POSTGRES_CLAVE_ASISTENTE: ${POSTGRES_CLAVE_ASISTENTE:-rol_asistente}
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # El script corre solo al crear el volumen.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-observatorio}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_postgres:
