name: observatorio-local

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_CLAVE_ASISTENTE: ${POSTGRES_CLAVE_ASISTENTE:-rol_asistente}
    ports:
      - "127.0.0.1:${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 2s

  etl:
    build: ./etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      ETL_BASE_DE_DATOS: postgresql+psycopg://rol_datos:rol_datos@db:5432/${POSTGRES_DB:-observatorio}
    volumes:
      - ./etl/datos:/app/datos:ro
    command: sh -ec "uv run --no-sync alembic upgrade head && uv run --no-sync etl bd --anio 2025"

volumes:
  datos_postgres:
