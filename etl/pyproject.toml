[project]
name = "etl"
version = "0.1.0"
description = "ETL del Componente B: cifras SCVS y Company Profile"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "python-calamine>=0.3",
    "pandera>=0.20",
    "rapidfuzz>=3.9",
    "scrapling[fetchers]>=0.5.1",
    "trafilatura>=1.12",
    "extruct>=0.17",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "matplotlib>=3.9",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
etl = "etl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Los notebooks son exploración y universo/ es el script inicial del Componente A.
extend-exclude = ["notebooks", "universo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
