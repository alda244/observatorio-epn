[project]
name = "rag"
version = "0.1.0"
description = "Componente A del Observatorio EPN: ingesta, índice y motor RAG con citación"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Embeddings reales. El prototipo usa un modelo multilingüe pequeño en CPU;
# el objetivo del plan es BAAI/bge-m3 (ADR 0003, pendiente).
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
rag = "rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
